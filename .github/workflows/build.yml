name: Build OpenVision IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем историю для отката

      - name: Rollback to stable commit
        run: |
          # Откатываемся на версию до обновления библиотек до Swift 6.3
          git checkout b7ce291 || git checkout $(git rev-list -n 1 --before="2026-03-01" main)

      - name: Prepare Config
        run: |
          cp Config.xcconfig.example Config.xcconfig
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = 1234567890/' Config.xcconfig
          sed -i '' 's/META_APP_ID = .*/META_APP_ID = 1234567890/' Config.xcconfig

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -archivePath $PWD/build/OpenVision.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
            
      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/OpenVision.xcarchive/Products/Applications/OpenVision.app Payload/
          zip -r OpenVision.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-Unsigned-IPA
          path: OpenVision.ipa
          retention-days: 5
